# pi0.5 full fine-tune on a unified 3-slot SO-101 dataset (LoRA disabled).
#
# The dataset exposes
#   observation.images.{base_0_rgb,left_wrist_0_rgb,right_wrist_0_rgb}
# plus a {slot}_mask column for each.
#
# The 224 letterbox resize is injected by train.py, which detects the _mask
# columns, so it does not need to be declared here.
#
# Variables substituted by scripts/train-base through envsubst:
#   ${DATASET_NAME} ${DATASET_PATH} ${OUTPUT_DIR}
#   ${BATCH_SIZE} ${GRAD_ACCUM} ${STEPS} ${SAVE_FREQ} ${WARMUP_STEPS} ${PEAK_LR}
#   ${WANDB_ENABLE} ${WANDB_PROJECT}

policy:
  type: pi05
  pretrained_path: /opt/models/pi05_base
  push_to_hub: false                  # avoids the lerobot validation error when repo_id is unset
  dtype: bfloat16
  device: cuda
  state_cond: true
  compile_model: false
  fuse_qkv: false
  fuse_gate_up: false
  gradient_checkpointing: false       # unused by vlash (no-op); batch 8 fits without it

dataset:
  repo_id: ${DATASET_NAME}
  root: ${DATASET_PATH}
  video_backend: torchcodec

job_name: ${DATASET_NAME}_base
output_dir: ${OUTPUT_DIR}
batch_size: ${BATCH_SIZE}
grad_accum_steps: ${GRAD_ACCUM}
steps: ${STEPS}
num_workers: 8
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: ${PEAK_LR}
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: ${WARMUP_STEPS}
  peak_lr: ${PEAK_LR}
  decay_lr: 2.5e-6
  num_decay_steps: ${STEPS}

save_checkpoint: true
save_freq: ${SAVE_FREQ}
log_freq: 10

wandb:
  enable: ${WANDB_ENABLE}
  project: ${WANDB_PROJECT}
  disable_artifact: true

max_delay_steps: 8

lora:
  enable: false                       # full fine-tune: all 3.62B parameters trainable
